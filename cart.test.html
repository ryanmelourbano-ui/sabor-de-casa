<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testes Unitários — js/cart.js</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f7f4ef;
      color: #1f2421;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      color: #c84b31;
      margin-bottom: 0.5rem;
    }
    .summary-banner {
      padding: 1rem 1.25rem;
      border-radius: 8px;
      font-weight: 700;
      margin: 1rem 0 1.5rem;
    }
    .summary-banner.pass {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .summary-banner.fail {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .test-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .test-item {
      background: #ffffff;
      border: 1px solid #e2dcd3;
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }
    .test-item.pass {
      border-left: 5px solid #16a34a;
    }
    .test-item.fail {
      border-left: 5px solid #dc2626;
    }
    .test-error {
      margin-top: 0.35rem;
      color: #b91c1c;
      font-family: monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>Suíte de Testes — Carrinho Determinístico (js/cart.js)</h1>
  <p>Validação de regras de negócio, customizações, limites de quantidade e cálculo de total com entrega.</p>

  <div id="test-summary" class="summary-banner">Executando testes...</div>
  <ul id="test-results" class="test-list"></ul>

  <script type="module">
    import { runCartTests } from './cart.test.js';

    const summaryEl = document.getElementById('test-summary');
    const listEl = document.getElementById('test-results');

    const report = runCartTests();

    summaryEl.textContent =
      report.failed === 0
        ? `✅ Todos os ${report.total} testes passaram (${report.passed}/${report.total})`
        : `❌ ${report.failed} teste(s) falharam (${report.passed}/${report.total} passaram)`;

    summaryEl.classList.add(report.failed === 0 ? 'pass' : 'fail');

    for (const item of report.results) {
      const li = document.createElement('li');
      li.className = `test-item ${item.passed ? 'pass' : 'fail'}`;

      const title = document.createElement('div');
      title.textContent = `${item.passed ? '✔' : '✘'} ${item.name}`;
      li.appendChild(title);

      if (!item.passed && item.error) {
        const err = document.createElement('div');
        err.className = 'test-error';
        err.textContent = item.error;
        li.appendChild(err);
      }

      listEl.appendChild(li);
    }
  </script>
</body>
</html>
