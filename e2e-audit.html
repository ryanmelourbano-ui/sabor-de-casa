<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auditoria E2E — Marmitaria Sabor da Casa</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f7f4ef;
      color: #1f2421;
      padding: 2rem;
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      color: #c84b31;
      margin-bottom: 0.5rem;
    }
    .summary-banner {
      padding: 1rem 1.25rem;
      border-radius: 8px;
      font-weight: 700;
      margin: 1rem 0 1.5rem;
    }
    .summary-banner.pass {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }
    .summary-banner.fail {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .test-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .test-item {
      background: #ffffff;
      border: 1px solid #e2dcd3;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      font-size: 0.92rem;
    }
    .test-item.pass {
      border-left: 5px solid #16a34a;
    }
    .test-item.fail {
      border-left: 5px solid #dc2626;
    }
    .test-cat {
      font-size: 0.75rem;
      font-weight: 700;
      color: #5e6562;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }
    .test-error {
      margin-top: 0.35rem;
      color: #b91c1c;
      font-family: monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>Relatório de Auditoria E2E — Marmitaria Sabor da Casa</h1>
  <p>
    Validação automatizada de Fluxo Feliz (3 itens + 1 personalização + confirmação),
    10 ataques de Jailbreak/Injection, 3 perguntas fora de escopo, erros de chave inválida / internet offline
    e isolamento em sessionStorage.
  </p>

  <div id="test-summary" class="summary-banner">Executando suíte E2E...</div>
  <ul id="test-results" class="test-list"></ul>

  <script type="module">
    import { runE2EAuditSuite } from './e2e-audit.js';

    const summaryEl = document.getElementById('test-summary');
    const listEl = document.getElementById('test-results');

    const report = await runE2EAuditSuite();

    summaryEl.textContent =
      report.failed === 0
        ? `✅ Todos os ${report.total} cenários E2E passaram (${report.passed}/${report.total})`
        : `❌ ${report.failed} cenário(s) falharam (${report.passed}/${report.total} passaram)`;

    summaryEl.classList.add(report.failed === 0 ? 'pass' : 'fail');

    for (const item of report.results) {
      const li = document.createElement('li');
      li.className = `test-item ${item.passed ? 'pass' : 'fail'}`;

      const cat = document.createElement('div');
      cat.className = 'test-cat';
      cat.textContent = item.category;
      li.appendChild(cat);

      const title = document.createElement('div');
      title.textContent = `${item.passed ? '✔' : '✘'} ${item.name}`;
      li.appendChild(title);

      if (!item.passed && item.error) {
        const err = document.createElement('div');
        err.className = 'test-error';
        err.textContent = item.error;
        li.appendChild(err);
      }

      listEl.appendChild(li);
    }
  </script>
</body>
</html>
